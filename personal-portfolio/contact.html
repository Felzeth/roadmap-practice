<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Felzeth</title>
  <meta name="description" content="Get in touch with Felzeth — Developer building open-source projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">felzeth</a>
    <nav class="site-nav">
      <a href="index.html">Home</a> /
      <a href="projects.html">Projects</a> /
      <a href="articles.html">Articles</a> /
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-content">
    <h1>Contact</h1>

    <p style="margin-bottom: 24px; color: var(--color-text-muted);">
      Find me on <a href="https://github.com/felzeth">GitHub</a> — follow me or open an issue on any of my repositories.
    </p>

    <form class="contact-form" action="#" method="post">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; all rights reserved 2025</p>
  </footer>

</body>
</html>
