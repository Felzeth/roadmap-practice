<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <meta name="description" content="A theme switcher that changes a card using CSS variables. No JavaScript required.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Radio inputs (hidden but accessible) -->
  <input type="radio" name="theme" id="theme-light" class="theme-radio" checked>
  <input type="radio" name="theme" id="theme-dark" class="theme-radio">
  <input type="radio" name="theme" id="theme-custom" class="theme-radio">

  <main class="wrapper">

    <!-- Theme Switcher -->
    <div class="switcher">
      <label for="theme-light" class="switcher-label" data-theme="light">Light</label>
      <label for="theme-dark" class="switcher-label" data-theme="dark">Dark</label>
      <label for="theme-custom" class="switcher-label" data-theme="custom">Custom</label>
    </div>

    <!-- Preview Card -->
    <div class="card">
      <h1>Hello, World!</h1>
      <p>This is a simple card that changes theme with CSS variables.</p>
      <button class="btn">Primary Button</button>
    </div>

  </main>

</body>
</html>
