<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Quiz App</h1>
            <p>Test your knowledge with our interactive quiz!</p>
            <div class="quiz-info">
                <p><strong>Questions:</strong> 8</p>
                <p><strong>Time per question:</strong> 60 seconds</p>
                <p><strong>Scoring:</strong> +1 for correct, -1 for incorrect or timeout</p>
            </div>
            <button id="start-btn" class="btn primary">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="timer" id="timer">60</div>
                <div class="score-display">Score: <span id="current-score">0</span></div>
            </div>
            
            <div class="question-card" id="question-card">
                <div class="question-number" id="question-number">Question 1 of 8</div>
                <h2 class="question-text" id="question-text">Question goes here?</h2>
                
                <div class="options" id="options">
                    <!-- Options will be generated by JavaScript -->
                </div>
                
                <button id="next-btn" class="btn secondary" disabled>Next Question</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1>Quiz Completed!</h1>
            <div class="final-score">
                <div class="score-circle">
                    <span id="final-score">0</span>
                    <span class="score-label">Points</span>
                </div>
            </div>
            
            <div class="results-summary" id="results-summary">
                <!-- Results will be generated by JavaScript -->
            </div>
            
            <button id="restart-btn" class="btn primary">Restart Quiz</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
